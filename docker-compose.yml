version: '3.8'

services:
  # 1. PostgreSQL 16 Enterprise Banking DB
  postgres:
    image: postgres:16-alpine
    container_name: nexa-postgres
    restart: always
    environment:
      POSTGRES_DB: nexawallet
      POSTGRES_USER: nexa_admin
      POSTGRES_PASSWORD: nexa_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa_admin -d nexawallet"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 7 High-Throughput Cache & Rate Limiter
  redis:
    image: redis:7-alpine
    container_name: nexa-redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Apache Kafka (KRaft mode - Zero Zookeeper dependency)
  kafka:
    image: bashj79/kafka-kraft:latest
    container_name: nexa-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

  # 4. PgAdmin Database Management Web UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nexa-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nexa.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # 5. NEXA Core Backend (Spring Boot 3.3.4 / Java 17 LTS)
  nexa-backend:
    build:
      context: ./nexa-core-backend
      dockerfile: Dockerfile
    container_name: nexa-backend
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexawallet
      SPRING_DATASOURCE_USERNAME: nexa_admin
      SPRING_DATASOURCE_PASSWORD: nexa_secure_password_2026
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
