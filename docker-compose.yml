version: '3.8'

services:
  # 1. PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: wallet-postgres
    restart: always
    environment:
      POSTGRES_DB: walletdb
      POSTGRES_USER: wallet_user
      POSTGRES_PASSWORD: wallet_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_user -d walletdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. PgAdmin Database Management Web UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: wallet-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@wallet.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # 3. Digital Wallet Backend (Spring Boot 3.3.4 / Java 17 LTS)
  wallet-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wallet-backend
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/walletdb
      SPRING_DATASOURCE_USERNAME: wallet_user
      SPRING_DATASOURCE_PASSWORD: wallet_password_2026
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
